name: Build Release Artifacts

on:
  push:
    branches:
      - master
      - release
      - "release/**"
      - "ci/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

# The product version lives in exactly one place: the `project(... VERSION ...)`
# line in CMakeLists.txt. Each job reads it at runtime into DESIRE_VERSION
# (via GITHUB_ENV), so bumping the release is a one-line change in CMakeLists.txt
# and every artifact name / release asset follows automatically.

jobs:
  build-windows:
    name: Windows x64 Release
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from CMakeLists.txt
        shell: bash
        run: |
          set -euo pipefail
          ver=$(sed -nE 's/^[[:space:]]*project\(BoratoDesire[[:space:]]+VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          test -n "$ver"
          echo "Resolved Borato Desire version: $ver"
          echo "DESIRE_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: >
          cmake --build build --config Release
          --target BoratoDesire_VST3 BoratoDesire_Standalone

      - name: Package artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "build\plugin\BoratoDesire_artefacts\Release"
          $dist = "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null

          $base = "BoratoDesire-v$env:DESIRE_VERSION-Windows-x64"

          # Both are bundle/exe folders; keep the parent so the zip extracts
          # as "Borato Desire.vst3/..." / a folder containing the .exe.
          Compress-Archive -Path "$root\VST3\Borato Desire.vst3" `
                           -DestinationPath "$dist\$base-VST3.zip"
          Compress-Archive -Path "$root\Standalone\Borato Desire.exe" `
                           -DestinationPath "$dist\$base-Standalone.zip"

          $lines = @(
            "# Borato Desire Windows install (x64)"
            ""
            "The artifacts are unsigned development builds."
            ""
            "The plugin UI is hosted in Microsoft WebView2. Windows 11 and most"
            "up-to-date Windows 10 systems already have the WebView2 runtime;"
            "if the plugin shows a diagnostic fallback screen instead of the"
            "full interface, install the Evergreen WebView2 runtime from"
            "Microsoft first."
            ""
            "## Manual VST3"
            ""
            "Unzip ``$base-VST3.zip`` and copy ``Borato Desire.vst3`` to:"
            ""
            "``C:\Program Files\Common Files\VST3\``"
            ""
            "## Standalone"
            ""
            "Unzip ``$base-Standalone.zip`` and run ``Borato Desire.exe`` directly."
          )
          $lines | Out-File -Encoding utf8 "$dist\INSTALL-Windows-x64.md"

          Get-ChildItem $dist

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: BoratoDesire-v${{ env.DESIRE_VERSION }}-Windows-x64-VST3
          path: dist/BoratoDesire-v${{ env.DESIRE_VERSION }}-Windows-x64-VST3.zip
          if-no-files-found: error

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: BoratoDesire-v${{ env.DESIRE_VERSION }}-Windows-x64-Standalone
          path: dist/BoratoDesire-v${{ env.DESIRE_VERSION }}-Windows-x64-Standalone.zip
          if-no-files-found: error

      - name: Upload install notes
        uses: actions/upload-artifact@v4
        with:
          name: BoratoDesire-v${{ env.DESIRE_VERSION }}-Windows-x64-install-notes
          path: dist/INSTALL-Windows-x64.md
          if-no-files-found: error

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoratoDesire-v${{ env.DESIRE_VERSION }}-Windows-x64-release-assets
          path: dist/*
          if-no-files-found: error

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/BoratoDesire-v${{ env.DESIRE_VERSION }}-Windows-x64-VST3.zip
            dist/BoratoDesire-v${{ env.DESIRE_VERSION }}-Windows-x64-Standalone.zip
            dist/INSTALL-Windows-x64.md

  build-macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each slice is validated on a NATIVE runner so auval loads the
          # component without Rosetta. Apple Silicon first shipped on macOS 11.
          - name: macOS arm64 Release
            runs_on: macos-15
            architecture: arm64
            artifact_suffix: macOS-arm64
            deployment_target: "11.0"
          # Intel slice on a native Intel runner; 10.15 (Catalina) is a safe min.
          - name: macOS Intel Release
            runs_on: macos-15-intel
            architecture: x86_64
            artifact_suffix: macOS-intel
            deployment_target: "10.15"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from CMakeLists.txt
        shell: bash
        run: |
          set -euo pipefail
          ver=$(sed -nE 's/^[[:space:]]*project\(BoratoDesire[[:space:]]+VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          test -n "$ver"
          echo "Resolved Borato Desire version: $ver"
          echo "DESIRE_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Configure
        run: >
          cmake -S . -B build
          -G Xcode
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.architecture }}
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Build VST3
        run: cmake --build build --config Release --target BoratoDesire_VST3 --parallel

      - name: Build AU
        run: cmake --build build --config Release --target BoratoDesire_AU --parallel

      - name: Sign and validate Audio Unit
        shell: bash
        run: |
          set -euo pipefail

          au="build/plugin/BoratoDesire_artefacts/Release/AU/Borato Desire.component"
          test -d "$au"

          # Ad-hoc sign the component in place so the bundle we validate is the
          # exact one we ship. auval on recent macOS rejects unsigned components.
          codesign --force --deep --sign - "$au"
          codesign --verify --deep --strict --verbose=2 "$au"

          # Install into the per-user Components path so auval can discover it.
          components="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$components"
          rm -rf "$components/Borato Desire.component"
          cp -R "$au" "$components/"

          installed="$components/Borato Desire.component"

          # Clear quarantine and the AU registration cache so a fresh scan runs.
          xattr -dr com.apple.quarantine "$installed" || true
          killall -9 AudioComponentRegistrar >/dev/null 2>&1 || true
          rm -f "$HOME/Library/Caches/AudioUnitCache/com.apple.audiounits.cache" || true

          # Make the validated slice (arm64 / x86_64) obvious in the log.
          file "$installed/Contents/MacOS/"*

          # Best-effort listing of our component; never fails the job.
          auval -a | grep -i Desire || true

          # Mandatory validation. Codes come from juce_add_plugin():
          # IS_SYNTH FALSE -> aufx, PLUGIN_CODE = Dsre, MANUFACTURER_CODE = BoCo.
          # With `set -e`, a non-zero auval exit fails this step and the workflow.
          auval -v aufx Dsre BoCo

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail

          artifact_root="build/plugin/BoratoDesire_artefacts/Release"
          dist="dist"
          artifact_suffix="${{ matrix.artifact_suffix }}"
          architecture="${{ matrix.architecture }}"
          mkdir -p "$dist"

          vst3="$artifact_root/VST3/Borato Desire.vst3"
          au="$artifact_root/AU/Borato Desire.component"

          test -d "$vst3"
          test -d "$au"

          base="BoratoDesire-v${DESIRE_VERSION}-${artifact_suffix}"

          # The AU is zipped from the same bundle that was signed and validated.
          ditto -c -k --keepParent "$vst3" "$dist/${base}-VST3.zip"
          ditto -c -k --keepParent "$au" "$dist/${base}-AU.zip"

          cat > "$dist/INSTALL-${artifact_suffix}.md" <<EOF
          # Borato Desire macOS install (${architecture})

          The Audio Unit is ad-hoc signed and was validated in CI with
          \`auval -v aufx Dsre BoCo\`. The VST3 is an unsigned development build.

          ## VST3

          Unzip ${base}-VST3.zip and copy Borato Desire.vst3 to:

              ~/Library/Audio/Plug-Ins/VST3/

          ## AU

          Unzip ${base}-AU.zip and copy Borato Desire.component to:

              ~/Library/Audio/Plug-Ins/Components/

          ## Gatekeeper note

          If macOS blocks the unsigned VST3, remove quarantine after unzipping:

              xattr -dr com.apple.quarantine "Borato Desire.vst3"
              xattr -dr com.apple.quarantine "Borato Desire.component"
          EOF

          ls -la "$dist"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: BoratoDesire-v${{ env.DESIRE_VERSION }}-${{ matrix.artifact_suffix }}-VST3
          path: dist/BoratoDesire-v${{ env.DESIRE_VERSION }}-${{ matrix.artifact_suffix }}-VST3.zip
          if-no-files-found: error

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: BoratoDesire-v${{ env.DESIRE_VERSION }}-${{ matrix.artifact_suffix }}-AU
          path: dist/BoratoDesire-v${{ env.DESIRE_VERSION }}-${{ matrix.artifact_suffix }}-AU.zip
          if-no-files-found: error

      - name: Upload install notes
        uses: actions/upload-artifact@v4
        with:
          name: BoratoDesire-v${{ env.DESIRE_VERSION }}-${{ matrix.artifact_suffix }}-install-notes
          path: dist/INSTALL-${{ matrix.artifact_suffix }}.md
          if-no-files-found: error

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoratoDesire-v${{ env.DESIRE_VERSION }}-${{ matrix.artifact_suffix }}-release-assets
          path: dist/*
          if-no-files-found: error

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/BoratoDesire-v${{ env.DESIRE_VERSION }}-${{ matrix.artifact_suffix }}-VST3.zip
            dist/BoratoDesire-v${{ env.DESIRE_VERSION }}-${{ matrix.artifact_suffix }}-AU.zip
            dist/INSTALL-${{ matrix.artifact_suffix }}.md

  build-ubuntu:
    name: Ubuntu Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from CMakeLists.txt
        shell: bash
        run: |
          set -euo pipefail
          ver=$(sed -nE 's/^[[:space:]]*project\(BoratoDesire[[:space:]]+VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          test -n "$ver"
          echo "Resolved Borato Desire version: $ver"
          echo "DESIRE_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Install JUCE + WebView Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libgtk-3-dev \
            xvfb
          # NEEDS_WEB_BROWSER links webkit2gtk on Linux; the pkg-config module
          # name differs across Ubuntu releases, so try the newer one first.
          sudo apt-get install -y libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Release and tests
        run: >
          cmake --build build
          --target BoratoDesire_VST3 BoratoDesire_Standalone DesireEngineTests PresetManagerTests

      - name: Run offline DSP tests
        run: >
          xvfb-run --auto-servernum
          --server-args="-screen 0 1280x1024x24"
          ctest --test-dir build --output-on-failure

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail

          artifact_root="build/plugin/BoratoDesire_artefacts/Release"
          dist="dist"
          mkdir -p "$dist"

          vst3="$artifact_root/VST3/Borato Desire.vst3"
          test -d "$vst3"

          base="BoratoDesire-v${DESIRE_VERSION}-Ubuntu"

          tar -czf "$dist/${base}-VST3.tar.gz" -C "$artifact_root/VST3" "Borato Desire.vst3"

          cat > "$dist/INSTALL-Ubuntu.md" <<EOF
          # Borato Desire Ubuntu install

          This artifact is an unsigned development build. The plugin UI needs
          WebKitGTK (webkit2gtk) installed on the target system.

          ## VST3

          Extract ${base}-VST3.tar.gz and copy Borato Desire.vst3 to:

              ~/.vst3/

          Then rescan plugins in your DAW.
          EOF

          ls -la "$dist"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: BoratoDesire-v${{ env.DESIRE_VERSION }}-Ubuntu-VST3
          path: dist/BoratoDesire-v${{ env.DESIRE_VERSION }}-Ubuntu-VST3.tar.gz
          if-no-files-found: error

      - name: Upload install notes
        uses: actions/upload-artifact@v4
        with:
          name: BoratoDesire-v${{ env.DESIRE_VERSION }}-Ubuntu-install-notes
          path: dist/INSTALL-Ubuntu.md
          if-no-files-found: error

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoratoDesire-v${{ env.DESIRE_VERSION }}-Ubuntu-release-assets
          path: dist/*
          if-no-files-found: error

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/BoratoDesire-v${{ env.DESIRE_VERSION }}-Ubuntu-VST3.tar.gz
            dist/INSTALL-Ubuntu.md
