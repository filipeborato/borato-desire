<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 1024">
    <!-- Background -->
    <rect width="1456" height="1024" fill="#07080E" stroke="#FF318F" stroke-width="2"/>
    
    <!-- Top Toolbar -->
    <rect x="20" y="20" width="1416" height="60" fill="none" stroke="#625D70" stroke-width="1" stroke-dasharray="4"/>
    <text x="728" y="55" fill="#625D70" font-family="sans-serif" font-size="14" text-anchor="middle">HEADER AREA</text>
    
    <!-- Left Input Panel -->
    <rect x="20" y="100" width="120" height="540" fill="none" stroke="#625D70" stroke-width="1" stroke-dasharray="4"/>
    
    <!-- Right Output Panel -->
    <rect x="1316" y="100" width="120" height="540" fill="none" stroke="#625D70" stroke-width="1" stroke-dasharray="4"/>
    
    <!-- Main Display Area -->
    <rect x="160" y="100" width="1136" height="540" fill="none" stroke="#FF318F" stroke-width="1" stroke-dasharray="4"/>
    
    <!-- Bottom Controls Area -->
    <rect x="20" y="660" width="1416" height="260" fill="none" stroke="#625D70" stroke-width="1" stroke-dasharray="4"/>
    
    <!-- Center Desire Knob Area -->
    <circle cx="728" cy="790" r="130" fill="none" stroke="#FF318F" stroke-width="2" stroke-dasharray="4"/>
    <text x="728" y="795" fill="#FF318F" font-family="sans-serif" font-size="20" text-anchor="middle">DESIRE</text>
    
    <!-- Sub knobs left/right -->
    <g fill="none" stroke="#625D70" stroke-width="1" stroke-dasharray="4">
        <circle cx="120" cy="790" r="55"/>
        <circle cx="255" cy="790" r="55"/>
        <circle cx="390" cy="790" r="55"/>
        <circle cx="525" cy="790" r="55"/>

        <circle cx="931" cy="790" r="55"/>
        <circle cx="1066" cy="790" r="55"/>
        <circle cx="1201" cy="790" r="55"/>
        <circle cx="1336" cy="790" r="55"/>
    </g>

    <g fill="#625D70" font-family="sans-serif" font-size="14" text-anchor="middle">
        <text x="120" y="795">INPUT</text>
        <text x="255" y="795">BODY</text>
        <text x="390" y="795">HEAT</text>
        <text x="525" y="795">SILK</text>

        <text x="931" y="795">MOTION</text>
        <text x="1066" y="795">WIDTH</text>
        <text x="1201" y="795">MIX</text>
        <text x="1336" y="795">OUTPUT</text>
    </g>
    
    <!-- Footer Area -->
    <rect x="20" y="940" width="1416" height="60" fill="none" stroke="#625D70" stroke-width="1" stroke-dasharray="4"/>
    <text x="728" y="975" fill="#625D70" font-family="sans-serif" font-size="14" text-anchor="middle" letter-spacing="4">BORATO COMPANY</text>
</svg>
