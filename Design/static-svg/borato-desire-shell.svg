<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 1024">
    <!-- Definitions for gradients -->
    <defs>
        <!-- Panel Base -->
        <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#141520" />
            <stop offset="100%" stop-color="#08090D" />
        </linearGradient>
        <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1A1B28" />
            <stop offset="100%" stop-color="#10111A" />
        </linearGradient>
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1A0D22" />
            <stop offset="100%" stop-color="#0E0713" />
        </linearGradient>
    </defs>

    <!-- Base Chassis Background -->
    <rect width="1456" height="1024" rx="20" fill="url(#chassisGrad)" />
    
    <!-- Outer Border Bevel -->
    <rect x="2" y="2" width="1452" height="1020" rx="18" fill="none" stroke="#2D2A3B" stroke-width="2"/>
    <rect x="4" y="4" width="1448" height="1016" rx="16" fill="none" stroke="#000000" stroke-width="4"/>

    <!-- Display Area Frame Background (for the glassy neon look) -->
    <rect x="150" y="100" width="1156" height="540" rx="20" fill="url(#glassGrad)" stroke="#211D29" stroke-width="2"/>

    <!-- Left Meter Area -->
    <rect x="30" y="100" width="100" height="540" rx="12" fill="url(#panelGrad)" stroke="#211D29" stroke-width="2"/>
    
    <!-- Right Meter Area -->
    <rect x="1326" y="100" width="100" height="540" rx="12" fill="url(#panelGrad)" stroke="#211D29" stroke-width="2"/>
    
    <line x1="30" y1="660" x2="1426" y2="660" stroke="#1A1B28" stroke-width="2"/>
    
    <!-- Main Desire Knob Ring (Static Part) -->
    <circle cx="728" cy="790" r="130" fill="url(#panelGrad)" stroke="#211D29" stroke-width="4"/>
    <circle cx="728" cy="790" r="110" fill="#0A0B10" />
    
    <!-- Texts - Header -->
    <text x="50" y="60" fill="#F0EDF5" font-family="sans-serif" font-size="24" font-weight="bold" letter-spacing="8">BORATO</text>
    <text x="50" y="80" fill="#FF318F" font-family="sans-serif" font-size="14" letter-spacing="12">COMPANY</text>
    
    <!-- Texts - Knobs Labels -->
    <g fill="#AAA5B7" font-family="sans-serif" font-size="16" text-anchor="middle" letter-spacing="2">
        <text x="120" y="715">INPUT</text>
        <text x="255" y="715">BODY</text>
        <text x="390" y="715">HEAT</text>
        <text x="525" y="715">SILK</text>
        
        <text x="931" y="715">MOTION</text>
        <text x="1066" y="715">WIDTH</text>
        <text x="1201" y="715">MIX</text>
        <text x="1336" y="715">OUTPUT</text>
    </g>

    <!-- Desire Label -->
    <text x="728" y="678" fill="#F0EDF5" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle" letter-spacing="4">DESIRE</text>

    <!-- Texts - Footer -->
    <text x="728" y="980" fill="#625D70" font-family="sans-serif" font-size="14" text-anchor="middle" letter-spacing="4">BORATO COMPANY</text>
    
    <!-- Left Meter Frame -->
    <rect x="59" y="137" width="32" height="466" rx="4" fill="#08090D" stroke="#000" stroke-width="2"/>
    <!-- Right Meter Frame -->
    <rect x="1365" y="137" width="32" height="466" rx="4" fill="#08090D" stroke="#000" stroke-width="2"/>

    <!-- Labels para Meters -->
    <g fill="#A0A0A0" font-family="sans-serif" font-size="10" letter-spacing="2">
        <!-- Input L/R -->
        <text x="75" y="110" font-weight="bold" font-size="12" text-anchor="middle">INPUT</text>
        <text x="65" y="130" font-weight="bold" text-anchor="middle">L</text>
        <text x="85" y="130" font-weight="bold" text-anchor="middle">R</text>

        <!-- Output L/R -->
        <text x="1381" y="110" font-weight="bold" font-size="12" text-anchor="middle">OUTPUT</text>
        <text x="1371" y="130" font-weight="bold" text-anchor="middle">L</text>
        <text x="1391" y="130" font-weight="bold" text-anchor="middle">R</text>
    </g>
</svg>
