<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs>
        <radialGradient id="mainBaseGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#1B1C26"/>
            <stop offset="60%" stop-color="#0E0F14"/>
            <stop offset="85%" stop-color="#050508"/>
            <stop offset="100%" stop-color="#000000"/>
        </radialGradient>
        
        <linearGradient id="mainShine" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
            <stop offset="45%" stop-color="#000000" stop-opacity="0.5"/>
            <stop offset="55%" stop-color="#000000" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
        </linearGradient>

        <linearGradient id="mainInnerShadow" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#000" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#fff" stop-opacity="0.15"/>
        </linearGradient>
    </defs>
    
    <!-- Outer bezel / rim base -->
    <circle cx="100" cy="100" r="98" fill="#11121A" stroke="#000" stroke-width="3"/>
    
    <!-- Main metallic body -->
    <circle cx="100" cy="100" r="92" fill="url(#mainBaseGrad)"/>
    <circle cx="100" cy="100" r="92" fill="url(#mainShine)"/>
    
    <!-- Inner concentric grooves for premium texture -->
    <circle cx="100" cy="100" r="60" fill="none" stroke="#000000" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="100" cy="100" r="30" fill="none" stroke="#000000" stroke-width="1.5" stroke-opacity="0.2"/>
    
    <!-- Indentation ring for the glow/arc -->
    <circle cx="100" cy="100" r="86" fill="none" stroke="url(#mainInnerShadow)" stroke-width="4"/>
</svg>
