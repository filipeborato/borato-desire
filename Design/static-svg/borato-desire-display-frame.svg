<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1156 540" font-family="'Segoe UI', -apple-system, sans-serif">
    <defs>
        <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f4f2f8"/>
            <stop offset="0.5" stop-color="#c9ccd9"/>
            <stop offset="0.55" stop-color="#8f99ab"/>
            <stop offset="1" stop-color="#d6d3e0"/>
        </linearGradient>
        <linearGradient id="desireGrad" x1="0" y1="0" x2="1" y2="0.4">
            <stop offset="0" stop-color="#ff8cc8"/>
            <stop offset="0.55" stop-color="#ff318f"/>
            <stop offset="1" stop-color="#c317ff"/>
        </linearGradient>
        <filter id="glowPink" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="3" result="b"/>
            <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Logo block -->
    <g>
        <text x="36" y="82" fill="url(#chromeGrad)" font-size="46" font-weight="bold" letter-spacing="10">BORATO</text>
        <text x="36" y="144" fill="url(#desireGrad)" font-size="54" font-weight="bold" font-style="italic" letter-spacing="6" filter="url(#glowPink)">DESIRE</text>
        <text x="38" y="178" fill="#aaa5b7" font-size="12.5" letter-spacing="3.5">SENSUAL SATURATION &amp;</text>
        <text x="38" y="198" fill="#aaa5b7" font-size="12.5" letter-spacing="3.5">HARMONIC ENHANCER</text>
    </g>

    <!-- "Desire" neon club sign -->
    <g transform="translate(1000 250) rotate(-6)" opacity="0.85">
        <ellipse cx="0" cy="0" rx="95" ry="58" fill="none" stroke="#b0206e" stroke-width="2" opacity="0.5" filter="url(#glowSoft)"/>
        <text x="0" y="14" fill="#ff5fae" font-size="46" font-style="italic" font-weight="bold" text-anchor="middle" font-family="'Segoe Script', 'Brush Script MT', cursive" filter="url(#glowPink)">Desire</text>
    </g>

    <!-- Frequency axis (log positions, 20 Hz .. 20 kHz) -->
    <g fill="#625d70" font-size="12" text-anchor="middle" letter-spacing="0.5">
        <text x="38" y="488">20</text>
        <text x="181" y="488">50</text>
        <text x="289" y="488">100</text>
        <text x="397" y="488">200</text>
        <text x="540" y="488">500</text>
        <text x="648" y="488">1k</text>
        <text x="756" y="488">2k</text>
        <text x="899" y="488">5k</text>
        <text x="1007" y="488">10k</text>
        <text x="1115" y="488">20k</text>
    </g>

</svg>
